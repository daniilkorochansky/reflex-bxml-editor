name: Build Reflex BXML Editor

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python_arch: x64
          - arch: x86
            python_arch: x86

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: ${{ matrix.python_arch }}
          cache: pip

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.11.1

      - name: Build executable
        shell: cmd
        run: |
          python -m PyInstaller ^
            --noconfirm ^
            --clean ^
            --onefile ^
            --add-data "icon.ico;." ^
            --windowed ^
            --name "Reflex BXML Editor" ^
            --icon "icon.ico" ^
            --version-file "version_info.txt" ^
            bxml_editor.py

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Reflex BXML Editor.exe" -DestinationPath "Reflex_BXML_Editor_${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reflex_BXML_Editor_${{ matrix.arch }}
          path: Reflex_BXML_Editor_${{ matrix.arch }}.zip

      - name: Add release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Reflex_BXML_Editor_${{ matrix.arch }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
